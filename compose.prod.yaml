# Production stack for https://attacksurf.dev (issues #132, #29).
# Traffic: Cloudflare edge -> Cloudflare Tunnel (cloudflared) -> caddy:80 -> web:5000 (gunicorn).
# No inbound ports are published: cloudflared dials out, everything else is internal-only.
# Usage: docs/deployment.md.
# SECRETS_DIR overrides where the secret files live (default /etc/attacksurf); only for a
# non-root local staging run, never in production.
name: attacksurf-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

x-app: &app
  build:
    context: .
    target: prod
  # Tagged per deployed commit by scripts/deploy.sh (WEB_IMAGE); the fallback keeps a hand-run
  # `docker compose -f compose.prod.yaml build` usable without the deploy script.
  image: ${WEB_IMAGE:-attacksurf:prod}
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  pids_limit: 128
  cpus: "1.0"
  mem_limit: 512m
  logging: *logging
  networks: [internal, egress]
  # The app env file (SECRET_KEY, DNS, LLM, ...); secrets stay in Docker secrets, never here.
  env_file: [./deploy/attacksurf.env]
  # Redis and Postgres passwords come from the same secret files the servers use, so the
  # connection strings never appear in this file or in an env file.
  secrets: [postgres_password, redis_password]
  entrypoint:
    - bash
    - -c
    # Ubuntu-based image: `/bin/sh` is dash, which lacks `${var//x/y}`. The placeholders are
    # replaced from the mounted secrets, then the service's own command (`$$@`) runs.
    - export DATABASE_URL="$${DATABASE_URL//__PGPASS__/$$(cat /run/secrets/postgres_password)}" REDIS_URL="$${REDIS_URL//__REDIS_PASS__/$$(cat /run/secrets/redis_password)}"; exec "$$@"
    - --
  environment:
    ENV: prod
    # One proxy hop: Cloudflare. cloudflared and Caddy are not counted as extra hops for
    # X-Forwarded-For (Caddy forwards the visitor address it received).
    PROXY_COUNT: "1"
    # Literal `$$` keeps Compose from interpolating; the placeholders are replaced from the
    # mounted secrets by the entrypoint above (passwords may contain `@`).
    DATABASE_URL: "postgresql+psycopg://attacksurf:__PGPASS__@postgres:5432/attacksurf"
    REDIS_URL: "redis://:__REDIS_PASS__@redis:6379/0"
    # Pinned: must match the artifact-store volume mount below.
    ARTIFACT_STORE_ROOT: /var/lib/attacksurf/artifact-store
    # Optional Sentry release tag injected by scripts/deploy.sh when deploying a SHA.
    SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  volumes:
    # Encrypted uploads (ADR 0028). Without it they would live in the container's writable
    # layer and vanish on every deploy while their database rows stay.
    - artifact-store:/var/lib/attacksurf/artifact-store
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # Publishes the app at attacksurf.dev and www.attacksurf.dev; routes are configured in the
  # Cloudflare dashboard (remote-managed tunnel), not here.
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:20241", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel_token
    secrets: [tunnel_token]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    pids_limit: 64
    cpus: "0.5"
    mem_limit: 128m
    logging: *logging
    networks: [internal, egress]
    depends_on:
      caddy:
        condition: service_healthy

  caddy:
    build:
      context: deploy
      dockerfile: Caddy.Dockerfile
    image: attacksurf-caddy:prod
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Non-root uid 10001 binds :80 without NET_BIND_SERVICE so Cloudflare Tunnel routes stay http://caddy:80.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=80
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    pids_limit: 64
    cpus: "0.5"
    mem_limit: 128m
    logging: *logging
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks: [internal]
    depends_on:
      web:
        condition: service_healthy

  # One-off: `docker compose -f compose.prod.yaml run --rm migrate` on every deploy.
  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    pids_limit: 64
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    # Werkzeug spools multipart uploads > 500 KiB to /tmp; tmpfs counts against mem_limit.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=320m
    cpus: "1.5"
    mem_limit: 1g
    command:
      - gunicorn
      - attacksurf.app:create_app()
      - --bind
      - 0.0.0.0:5000
      - --workers
      - "2"
      - --threads
      - "4"
      - --timeout
      - "120"
      - --graceful-timeout
      - "30"
      - --keep-alive
      - "5"
      - --max-requests
      - "1000"
      - --max-requests-jitter
      - "100"
      - --worker-tmp-dir
      - /dev/shm
    expose: ["5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

  # Consumes the `passive` queue: ownership checks, dns_passive scans, artifact purge (#174).
  # Without it every `passive.verify_ownership` job stays queued and the ownership card
  # polls forever. `worker-analysis` and the sandbox services stay out until the first analysis
  # task (#92, ADR 0031).
  worker-passive:
    <<: *app
    command:
      ["celery", "-A", "attacksurf.workers.app", "worker", "-Q", "passive", "-c", "2",
       "-n", "passive@%h", "--loglevel", "INFO"]
    healthcheck:
      # `docker exec` does not inherit the entrypoint's exported, password-substituted URL,
      # so substitute it here too; otherwise the probe dials `__REDIS_PASS__` and fails.
      # Explicit `bash -c`: CMD-SHELL runs `/bin/sh` (dash), which rejects `${var//pat/rep}`.
      test: ["CMD-SHELL", "bash -c 'export REDIS_URL=\"$${REDIS_URL//__REDIS_PASS__/$$(cat /run/secrets/redis_password)}\"; exec celery -A attacksurf.workers.app inspect ping -d passive@$$HOSTNAME --timeout 5'"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Consumes connection tests from Settings (ai.test_connection) on the `ai` queue.
  worker-ai:
    <<: *app
    command:
      ["celery", "-A", "attacksurf.workers.app", "worker", "-Q", "ai", "-c", "2",
       "-n", "ai@%h", "--loglevel", "INFO"]
    healthcheck:
      # Like worker-passive, substitute the Redis secret in a fresh bash for each probe.
      test: ["CMD-SHELL", "bash -c 'export REDIS_URL=\"$${REDIS_URL//__REDIS_PASS__/$$(cat /run/secrets/redis_password)}\"; exec celery -A attacksurf.workers.app inspect ping -d ai@$$HOSTNAME --timeout 5'"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Schedules the hourly ownership re-verification and the 10-minute artifact purge.
  # Useless without `worker-passive` (and vice versa): beat only queues, the worker consumes.
  beat:
    <<: *app
    pids_limit: 64
    cpus: "0.5"
    mem_limit: 256m
    # Schedule state in /tmp: the image's /app is not meant to be written at runtime.
    command:
      ["celery", "-A", "attacksurf.workers.app", "beat", "--loglevel", "INFO",
       "--schedule", "/tmp/celerybeat-schedule"]
    # `up --wait` needs a healthcheck on every service; beat has no ping, so check its broker.
    # Explicit `bash -c` for the substitution: CMD-SHELL runs `/bin/sh` (dash).
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'export REDIS_URL=\"$${REDIS_URL//__REDIS_PASS__/$$(cat /run/secrets/redis_password)}\"; exec python -c \"from attacksurf.workers.app import app; app.connection_for_write().ensure_connection(max_retries=1)\"'"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  postgres:
    image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    # Official entrypoint fixes pgdata permissions and drops root via gosu.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    pids_limit: 128
    cpus: "1.0"
    mem_limit: 1g
    logging: *logging
    environment:
      POSTGRES_USER: attacksurf
      POSTGRES_DB: attacksurf
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attacksurf -d attacksurf"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks: [internal]

  redis:
    image: redis:8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    # Official entrypoint drops root to `redis` via gosu.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SETPCAP
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /data:rw,noexec,nosuid,size=16m
    pids_limit: 64
    cpus: "0.5"
    mem_limit: 256m
    logging: *logging
    # The image entrypoint drops privileges to `redis` before exec'ing the server. It must keep
    # running: replacing it with a shell would leave redis-server as root. The secret is read
    # into a variable first and exported in a *separate* statement: in `VAR=... exec cmd "$VAR"`
    # the expansion happens before the assignment, so the value arrives empty and the flag is
    # dropped (redis then starts without a password).
    entrypoint:
      - sh
      - -c
      - REDIS_PASSWORD="$$(cat /run/secrets/redis_password)"; export REDIS_PASSWORD; exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 192mb --maxmemory-policy noeviction
      - --
    secrets: [redis_password]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks: [internal]

secrets:
  tunnel_token:
    file: ${SECRETS_DIR:-/etc/attacksurf}/tunnel.token
  postgres_password:
    file: ${SECRETS_DIR:-/etc/attacksurf}/postgres_password
  redis_password:
    file: ${SECRETS_DIR:-/etc/attacksurf}/redis_password

networks:
  internal:
    internal: true
  egress:

volumes:
  pgdata:
  artifact-store:
