# Production stack for https://attacksurf.dev (issue #132).
# Traffic: Cloudflare edge -> Cloudflare Tunnel (cloudflared) -> caddy:80 -> web:5000 (gunicorn).
# No inbound ports are published: cloudflared dials out, everything else is internal-only.
# Usage: docs/deployment.md.
# SECRETS_DIR overrides where the secret files live (default /etc/attacksurf); only for a
# non-root local staging run, never in production.
name: attacksurf-prod

x-app: &app
  build:
    context: .
    target: prod
  image: attacksurf:prod
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks: [internal]
  # Redis and Postgres passwords come from the same secret files the servers use, so the
  # connection strings never appear in this file or in an env file.
  secrets: [postgres_password, redis_password]
  entrypoint:
    - bash
    - -c
    # Ubuntu-based image: `/bin/sh` is dash, which lacks `${var//x/y}`. The placeholders are
    # replaced from the mounted secrets, then the service's own command (`$$@`) runs.
    - export DATABASE_URL="$${DATABASE_URL//__PGPASS__/$$(cat /run/secrets/postgres_password)}" REDIS_URL="$${REDIS_URL//__REDIS_PASS__/$$(cat /run/secrets/redis_password)}"; exec "$$@"
    - --
  environment:
    ENV: prod
    # One proxy hop: Cloudflare. cloudflared and Caddy are not counted as extra hops for
    # X-Forwarded-For (Caddy forwards the visitor address it received).
    PROXY_COUNT: "1"
    # Literal `$$` keeps Compose from interpolating; the placeholders are replaced from the
    # mounted secrets by the entrypoint above (passwords may contain `@`).
    DATABASE_URL: "postgresql+psycopg://attacksurf:__PGPASS__@postgres:5432/attacksurf"
    REDIS_URL: "redis://:__REDIS_PASS__@redis:6379/0"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # Publishes the app at attacksurf.dev and www.attacksurf.dev; routes are configured in the
  # Cloudflare dashboard (remote-managed tunnel), not here.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:20241", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel_token
    secrets: [tunnel_token]
    security_opt:
      - no-new-privileges:true
    networks: [internal]
    depends_on: [caddy]

  caddy:
    build:
      context: deploy
      dockerfile: Caddy.Dockerfile
    image: attacksurf-caddy:prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks: [internal]
    depends_on: [web]

  # One-off: `docker compose -f compose.prod.yaml run --rm migrate` on every deploy.
  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file: [./deploy/attacksurf.env]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    env_file: [./deploy/attacksurf.env]
    command: ["gunicorn", "attacksurf.app:create_app()", "--bind", "0.0.0.0:5000", "--workers", "2", "--threads", "4"]
    expose: ["5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

  postgres:
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    restart: unless-stopped
    environment:
      POSTGRES_USER: attacksurf
      POSTGRES_DB: attacksurf
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attacksurf -d attacksurf"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks: [internal]

  redis:
    image: redis:8@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    restart: unless-stopped
    # The image entrypoint drops privileges to `redis` before exec'ing the server. It must keep
    # running: replacing it with a shell would leave redis-server as root. The secret is read
    # into a variable first and exported in a *separate* statement: in `VAR=... exec cmd "$VAR"`
    # the expansion happens before the assignment, so the value arrives empty and the flag is
    # dropped (redis then starts without a password).
    entrypoint:
      - sh
      - -c
      - REDIS_PASSWORD="$$(cat /run/secrets/redis_password)"; export REDIS_PASSWORD; exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
      - --
    secrets: [redis_password]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks: [internal]

secrets:
  tunnel_token:
    file: ${SECRETS_DIR:-/etc/attacksurf}/tunnel.token
  postgres_password:
    file: ${SECRETS_DIR:-/etc/attacksurf}/postgres_password
  redis_password:
    file: ${SECRETS_DIR:-/etc/attacksurf}/redis_password

networks:
  internal:

volumes:
  pgdata:
