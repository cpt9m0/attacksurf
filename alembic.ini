# Alembic config. The database URL comes from Settings (DATABASE_URL), never from this file.
# Usage: `make migrate`, or `uv run alembic upgrade head` (see docs/development.md).
[alembic]
# Inside the package, so migrations ship with the prod image.
script_location = attacksurf.infra.db:migrations
# Sequential, readable revision files: pass `--rev-id 0002` etc. (see the db-migration skill).
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
