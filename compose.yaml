# Local development stack: `make up` (or `docker compose up -d --wait`).
# Dev-only credentials; every host port is bound to 127.0.0.1. Production compose: #29.
name: attacksurf

x-app: &app
  build:
    context: .
    target: dev
  image: attacksurf:dev
  env_file:
    - path: .env
      required: false
  environment: &app-env
    ENV: dev
    DATABASE_URL: postgresql+psycopg://attacksurf:attacksurf@postgres:5432/attacksurf
    REDIS_URL: redis://redis:6379/0
    DNS_RESOLVERS: ${DNS_RESOLVERS:-1.1.1.1,8.8.8.8}
    DNS_TIMEOUT_SECONDS: ${DNS_TIMEOUT_SECONDS:-3}
    DNS_LIFETIME_SECONDS: ${DNS_LIFETIME_SECONDS:-5}
    DNS_MAX_CONCURRENCY: ${DNS_MAX_CONCURRENCY:-20}
    IP_ASN_DB_PATH: ${IP_ASN_DB_PATH:-}
  volumes:
    - ./src:/app/src  # hot reload
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:5000:5000"

  postgres:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: attacksurf
      POSTGRES_PASSWORD: attacksurf
      POSTGRES_DB: attacksurf
    volumes:
      # 18+ stores data in a major-version subdirectory of /var/lib/postgresql,
      # so the volume must be mounted one level above PGDATA (docker-library/postgres#1259).
      - pgdata:/var/lib/postgresql
      # Runs only when the volume is created: adds the `attacksurf_test` database for `make test`.
      - ./compose/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attacksurf -d attacksurf"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Celery (ADR 0003). No hot reload: `docker compose restart worker-passive` after code changes.
  worker-passive: &worker
    <<: *app
    command:
      ["celery", "-A", "attacksurf.workers.app", "worker", "-Q", "passive", "-c", "4",
       "-n", "passive@%h", "--loglevel", "INFO"]
    healthcheck: &worker-health
      test: ["CMD-SHELL", "celery -A attacksurf.workers.app inspect ping -d passive@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
  worker-ai:
    <<: *worker
    command:
      ["celery", "-A", "attacksurf.workers.app", "worker", "-Q", "ai", "-c", "2",
       "-n", "ai@%h", "--loglevel", "INFO"]
    healthcheck:
      <<: *worker-health
      test: ["CMD-SHELL", "celery -A attacksurf.workers.app inspect ping -d ai@$$HOSTNAME --timeout 5"]
  beat:
    <<: *app
    # Schedule state in /tmp: the image's /app is not meant to be written at runtime.
    command:
      ["celery", "-A", "attacksurf.workers.app", "beat", "--loglevel", "INFO",
       "--schedule", "/tmp/celerybeat-schedule"]
    # `up --wait` needs a healthcheck on every service; beat has no ping, so check its broker.
    healthcheck:
      test: ["CMD", "python", "-c", "from attacksurf.workers.app import app; app.connection_for_write().ensure_connection(max_retries=1)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
