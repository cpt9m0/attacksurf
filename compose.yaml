# Local development stack: `make up` (or `docker compose up -d --wait`).
# Dev-only credentials; every host port is bound to 127.0.0.1. Production compose: #29.
name: attacksurf

x-app: &app
  build:
    context: .
    target: dev
  image: attacksurf:dev
  env_file:
    - path: .env
      required: false
  environment: &app-env
    ENV: dev
    DATABASE_URL: postgresql+psycopg://attacksurf:attacksurf@postgres:5432/attacksurf
    REDIS_URL: redis://redis:6379/0
    # Pinned like the URLs above: must match the artifact-store volume mount below.
    ARTIFACT_STORE_ROOT: /var/lib/attacksurf/artifact-store
    DNS_RESOLVERS: ${DNS_RESOLVERS:-1.1.1.1,8.8.8.8}
    DNS_TIMEOUT_SECONDS: ${DNS_TIMEOUT_SECONDS:-3}
    DNS_LIFETIME_SECONDS: ${DNS_LIFETIME_SECONDS:-5}
    DNS_MAX_CONCURRENCY: ${DNS_MAX_CONCURRENCY:-20}
    IP_ASN_DB_PATH: ${IP_ASN_DB_PATH:-}
    APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    APP_ENCRYPTION_OLD_KEYS: ${APP_ENCRYPTION_OLD_KEYS:-}
    ARTIFACT_MAX_BYTES: ${ARTIFACT_MAX_BYTES:-}
    ARTIFACT_RETENTION_HOURS: ${ARTIFACT_RETENTION_HOURS:-}
    ARTIFACT_ORG_QUOTA_BYTES: ${ARTIFACT_ORG_QUOTA_BYTES:-}
    LLM_MONTHLY_INSTANCE_TOKEN_BUDGET: ${LLM_MONTHLY_INSTANCE_TOKEN_BUDGET:-}
    LLM_ALLOWED_BASE_HOSTS: ${LLM_ALLOWED_BASE_HOSTS:-}
    SCAN_MAX_STARTS_PER_HOUR: ${SCAN_MAX_STARTS_PER_HOUR:-}
    SCAN_DEFAULT_FREQUENCY: ${SCAN_DEFAULT_FREQUENCY:-weekly}
    # Unset (the default here): the workers refuse every sandbox request. Only `worker-analysis`
    # sets it, to the opt-in launcher; any other value is http://host[:port] only.
    SANDBOX_LAUNCHER_URL: ${SANDBOX_LAUNCHER_URL:-}
  volumes:
    - ./src:/app/src  # hot reload
    # Encrypted artifacts (ADR 0028). On the anchor, not per service: a merge replaces lists.
    - artifact-store:/var/lib/attacksurf/artifact-store
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

# The sandbox services (ADR 0016): no app env file, no database or Redis URL, no encryption key.
# They read the process environment only, so nothing from `.env` reaches them.
x-sandbox: &sandbox
  build:
    context: .
    target: dev
  image: attacksurf:dev
  profiles: [sandbox]
  networks: [sandbox]
  environment: &sandbox-env
    ENV: dev
    # Dev hosts rarely have gVisor; a host with `runsc` still uses it. Refused when ENV=prod.
    SANDBOX_ALLOW_RUNC: ${SANDBOX_ALLOW_RUNC:-true}
    SANDBOX_ARTIFACT_ROOT: ${SANDBOX_ARTIFACT_ROOT:-/tmp/attacksurf-sandbox}

services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:5000:5000"

  postgres:
    image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_USER: attacksurf
      POSTGRES_PASSWORD: attacksurf
      POSTGRES_DB: attacksurf
    volumes:
      # 18+ stores data in a major-version subdirectory of /var/lib/postgresql,
      # so the volume must be mounted one level above PGDATA (docker-library/postgres#1259).
      - pgdata:/var/lib/postgresql
      # Runs only when the volume is created: adds the `attacksurf_test` database for `make test`.
      - ./compose/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attacksurf -d attacksurf"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Celery (ADR 0003). No hot reload: `docker compose restart worker-passive` after code changes.
  worker-passive: &worker
    <<: *app
    command:
      ["celery", "-A", "attacksurf.workers.app", "worker", "-Q", "passive", "-c", "4",
       "-n", "passive@%h", "--loglevel", "INFO"]
    healthcheck: &worker-health
      test: ["CMD-SHELL", "celery -A attacksurf.workers.app inspect ping -d passive@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
  worker-ai:
    <<: *worker
    command:
      ["celery", "-A", "attacksurf.workers.app", "worker", "-Q", "ai", "-c", "2",
       "-n", "ai@%h", "--loglevel", "INFO"]
    healthcheck:
      <<: *worker-health
      test: ["CMD-SHELL", "celery -A attacksurf.workers.app inspect ping -d ai@$$HOSTNAME --timeout 5"]
  # Opt-in (`sandbox` profile). Consumes `analysis` (ADR 0031) and is the only app service that
  # knows the launcher. Until #87/#101 register the analysis tasks, Celery drops the upload jobs
  # it receives and their rows stay `queued`.
  worker-analysis:
    <<: *worker
    profiles: [sandbox]
    command:
      ["celery", "-A", "attacksurf.workers.app", "worker", "-Q", "analysis", "-c", "2",
       "-n", "analysis@%h", "--loglevel", "INFO"]
    healthcheck:
      <<: *worker-health
      test: ["CMD-SHELL", "celery -A attacksurf.workers.app inspect ping -d analysis@$$HOSTNAME --timeout 5"]
    # `default` for Postgres and Redis, `sandbox` for the launcher (ADR 0016).
    networks: [default, sandbox]
    environment:
      <<: *app-env
      SANDBOX_LAUNCHER_URL: http://sandbox-launcher:8791
      SANDBOX_ARTIFACT_ROOT: ${SANDBOX_ARTIFACT_ROOT:-/tmp/attacksurf-sandbox}
    # Lists are replaced by a merge, so the `x-app` ones are repeated. The staging folder is
    # read-write here (it stages decrypted artifacts) and read-only in the launcher.
    volumes:
      - ./src:/app/src
      - artifact-store:/var/lib/attacksurf/artifact-store
      - ${SANDBOX_ARTIFACT_ROOT:-/tmp/attacksurf-sandbox}:${SANDBOX_ARTIFACT_ROOT:-/tmp/attacksurf-sandbox}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox-launcher:
        condition: service_healthy
  beat:
    <<: *app
    # Schedule state in /tmp: the image's /app is not meant to be written at runtime.
    command:
      ["celery", "-A", "attacksurf.workers.app", "beat", "--loglevel", "INFO",
       "--schedule", "/tmp/celerybeat-schedule"]
    # `up --wait` needs a healthcheck on every service; beat has no ping, so check its broker.
    healthcheck:
      test: ["CMD", "python", "-c", "from attacksurf.workers.app import app; app.connection_for_write().ensure_connection(max_retries=1)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # Opt-in: `docker compose --profile sandbox up -d --wait`. The only service with the Docker
  # socket; the launcher fixes the analyzer command, this proxy only checks what Docker is asked.
  sandbox-proxy:
    <<: *sandbox
    command: ["python", "-m", "attacksurf.sandbox_proxy"]
    volumes:
      - ./src:/app/src:ro
      - /var/run/docker.sock:/var/run/docker.sock
    # The image's HEALTHCHECK probes port 5000. The proxy has no health route, so a TCP connect
    # shows it is listening without sending anything to Docker.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8790), 2).close()"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # Opt-in. No socket: it asks the proxy. Mounts the staging folder read-only, at the same path
  # as on the host, because Docker resolves the analyzer's bind source on the host.
  sandbox-launcher:
    <<: *sandbox
    command: ["python", "-m", "attacksurf.sandbox_launcher"]
    volumes:
      - ./src:/app/src:ro
      - ${SANDBOX_ARTIFACT_ROOT:-/tmp/attacksurf-sandbox}:${SANDBOX_ARTIFACT_ROOT:-/tmp/attacksurf-sandbox}:ro
    depends_on:
      sandbox-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

networks:
  # No route to the internet or the host. Postgres and Redis are not on it.
  sandbox:
    internal: true

volumes:
  pgdata:
  artifact-store:
