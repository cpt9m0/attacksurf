version: 2
updates:
  # Prefixes make Dependabot PR titles start with a Conventional Commit type
  # (docs/conventions.md); `pr-title` checks only that prefix for Dependabot PRs.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: docker
    # The root Dockerfile and every sandbox analyzer image (ADR 0018), so base updates arrive together.
    directories: ["/", "/sandbox/images/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
