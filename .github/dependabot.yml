version: 2
updates:
  # Prefixes make Dependabot PR titles start with a Conventional Commit type
  # (docs/conventions.md); `pr-title` checks only that prefix for Dependabot PRs.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
