name: 🧩 Task
description: Planned work with clear acceptance criteria (one PR's worth)
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        Title: imperative and specific, e.g. "Add DMARC policy check". See docs/conventions.md.
        Too big for one PR (~400 changed lines)? Split it and group under an epic.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences, the outcome and why it matters.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable results. Each becomes at least one test.
      value: |
        - 
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: input
    id: depends
    attributes:
      label: Depends on
      placeholder: "#4, #8"
  - type: input
    id: epic
    attributes:
      label: Part of epic
      placeholder: "#31"
