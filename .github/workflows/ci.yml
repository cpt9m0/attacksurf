name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # gitleaks' hook only scans staged changes (nothing in CI); the `secrets` job scans history.
      - name: pre-commit (ruff, hygiene)
        env:
          SKIP: gitleaks
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: pyright
        run: uv run pyright

  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: attacksurf
          POSTGRES_PASSWORD: attacksurf
          POSTGRES_DB: attacksurf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attacksurf -d attacksurf_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # DB tests fail (not skip) in CI without it; see tests/integration/conftest.py.
      TEST_DATABASE_URL: postgresql+psycopg://attacksurf:attacksurf@localhost:5432/attacksurf_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python }}
      - name: pytest (coverage gate 80%)
        run: uv run --python ${{ matrix.python }} pytest

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # scan every commit, not just the checked-out tree
      # Same version as the pre-commit hook; the Go checksum database verifies the module.
      - name: gitleaks (full git history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --verbose

  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build prod image
        run: docker build --target prod -t attacksurf:prod .
      - name: Prod image runs as non-root
        run: test "$(docker run --rm --entrypoint id attacksurf:prod -u)" = "10001"
      - name: Start dev stack and wait until healthy
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test /healthz
        run: curl -fsS http://127.0.0.1:5000/healthz
      - name: Migrations apply on a fresh database (make migrate)
        run: docker compose run --rm web alembic upgrade head
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
