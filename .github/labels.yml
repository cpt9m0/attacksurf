# Source of truth for repository labels (docs/conventions.md §1).
# Applied automatically by .github/workflows/labels.yml on push to main.
# Type
- { name: bug, color: "d73a4a", description: "Something isn't working" }
- { name: enhancement, color: "a2eeef", description: "New feature or improvement" }
- { name: chore, color: "cfd3d7", description: "Maintenance, tooling, setup" }
- { name: docs, color: "0075ca", description: "Documentation" }
- { name: new-check, color: "5319e7", description: "New security check / scanner" }
- { name: epic, color: "3e4b9e", description: "Group of tasks forming a milestone" }
# Area
- { name: "area:infra", color: "fbca04", description: "Tooling, Docker, deploy, config" }
- { name: "area:data", color: "fbca04", description: "Models, migrations, DB" }
- { name: "area:auth", color: "fbca04", description: "Authentication, tenancy, roles" }
- { name: "area:ui", color: "fbca04", description: "Templates, HTMX, design system" }
- { name: "area:workers", color: "fbca04", description: "Celery, scheduling, notifications" }
- { name: "area:scanners", color: "fbca04", description: "Scanner framework and pipeline" }
- { name: "area:dns", color: "fbca04", description: "DNS module" }
- { name: "area:ai", color: "fbca04", description: "LLM providers, triage, prompts" }
- { name: "area:security", color: "fbca04", description: "ScopeGuard, SSRF, secrets, hardening" }
# Priority
- { name: "priority:high", color: "b60205", description: "Do next" }
- { name: "priority:low", color: "c5def5", description: "Nice to have" }
# Status
- { name: triage, color: "ededed", description: "Needs maintainer review" }
- { name: blocked, color: "000000", description: "Waiting on another issue or decision" }
- { name: needs-design, color: "f9d0c4", description: "Needs DESIGN.md / Claude Design work first" }
- { name: good first issue, color: "7057ff", description: "Good for newcomers" }
- { name: help wanted, color: "008672", description: "Extra attention is needed" }
# Milestone / other
- { name: mvp, color: "0e8a16", description: "Required for the MVP (epic #31)" }
- { name: funding, color: "ea4aaa", description: "Sponsorship and funding" }
