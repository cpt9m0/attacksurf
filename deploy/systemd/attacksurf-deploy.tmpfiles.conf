# Root-owned lock file for attacksurf-deploy.service.
# /run/lock is world-writable + sticky and fs.protected_regular=2 also applies to root, so a
# lock file created by a non-root manual run would make the root unit fail with EACCES forever.
# Creating it at boot (and on `systemd-tmpfiles --create`) keeps the owner correct.
f /run/lock/attacksurf-deploy.lock 0644 root root -
