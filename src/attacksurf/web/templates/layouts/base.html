{#- App shell (DESIGN.md §4). No inline <script>, style= or on*= anywhere: the CSP forbids them. -#}
{%- from "components/icon.html" import icon -%}
{%- from "components/flash.html" import flash_messages -%}
<!doctype html>
<html lang="en">
<head>
  {% include "layouts/_head.html" %}
  <title>{% block title %}{% endblock %} · attacksurf</title>
</head>
{#- HTMX sends the CSRF token on every request (an attribute, so no inline script for the CSP). #}
<body hx-headers='{{ {"X-CSRFToken": csrf_token()} | tojson }}'>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="{{ url_for('ui.dashboard') }}">{{ icon("shield-check") }} attacksurf</a>
      <div class="topbar-actions">
        <button type="button" class="btn btn-ghost theme-toggle" x-data="themeToggle" @click="toggle"
                aria-label="Dark mode" aria-pressed="false" :aria-pressed="pressed">
          <span class="icon-sun">{{ icon("sun") }}</span><span class="icon-moon">{{ icon("moon") }}</span>
        </button>
        {%- if current_user.is_authenticated %}
        <span class="user-menu">{{ current_user.email }} · {{ current_user.org_name }}</span>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="btn btn-secondary">Log out</button>
        </form>
        {%- endif %}
      </div>
    </header>

    <nav class="sidenav" aria-label="Main">
      <ul>
        {%- for item in nav_items %}
        <li>
          <a href="{{ url_for(item.endpoint) }}"
             {%- if request.endpoint == item.endpoint %} aria-current="page"{% endif %}>
            {{ icon(item.icon) }} {{ item.label }}
          </a>
        </li>
        {%- endfor %}
      </ul>
    </nav>

    <main class="content" id="content">
      {{ flash_messages() }}
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      {#- AGPL-3.0 §13: network users must be offered the source. #}
      <a href="https://github.com/cpt9m0/attacksurf">Source code</a> (AGPL-3.0)
    </footer>
  </div>
</body>
</html>
