[project]
name = "attacksurf"
version = "0.1.0"
description = "Open-source, AI-powered attack surface management (ASM): subdomain discovery, DNS security checks, subdomain takeover detection, and LLM triage."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "cpt9m0" }]
keywords = [
    "attack-surface-management",
    "asm",
    "easm",
    "cybersecurity",
    "security-scanner",
    "subdomain-enumeration",
    "subdomain-takeover",
    "dns-security",
    "dmarc",
    "llm",
    "ai-security",
    "flask",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: Name Service (DNS)",
]
dependencies = [
    "flask>=3.1.3",
]

[project.urls]
Homepage = "https://github.com/cpt9m0/attacksurf"
Documentation = "https://github.com/cpt9m0/attacksurf/tree/main/docs"
Issues = "https://github.com/cpt9m0/attacksurf/issues"
Changelog = "https://github.com/cpt9m0/attacksurf/blob/main/CHANGELOG.md"
Funding = "https://github.com/sponsors/cpt9m0"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PL", "PT", "C4", "RET"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=attacksurf --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["attacksurf"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
